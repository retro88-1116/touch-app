<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>어르신 터치 & 마우스 클릭 연습</title>
  <style>
    :root {
      --primary-color: #2E7D32;
      --primary-hover: #1B5E20;
      --accent-color: #1976D2;
      --bg-color: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #212121;
      --text-sub: #616161;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 28px;
    }

    /* 반응형 버튼 */
    .touch-btn {
      width: 100%;
      min-height: 72px;
      background-color: var(--primary-color);
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
      transition: background-color 0.15s, transform 0.1s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      touch-action: manipulation;
    }

    .touch-btn:hover {
      background-color: var(--primary-hover);
    }

    .touch-btn:active {
      transform: scale(0.97);
    }

    /* 게임 영역 */
    .game-area {
      width: 100%;
      height: 240px;
      background-color: #F0F4F8;
      border: 2px dashed #B0BEC5;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }

    /* 타겟 파란 원 */
    .target-circle {
      width: 56px;
      height: 56px;
      background: radial-gradient(circle at 30% 30%, #42A5F5, #1565C0);
      border-radius: 50%;
      position: absolute;
      top: 92px;
      left: 212px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(21, 101, 192, 0.4);
      transition: transform 0.1s, top 0.2s ease-out, left 0.2s ease-out;
      touch-action: manipulation;
    }

    .target-circle:active {
      transform: scale(0.85);
    }

    /* 상태 표시 */
    .status-card {
      background-color: #E8F5E9;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-color);
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">터치 & 클릭 연습</h1>
    <p class="subtitle">버튼을 누르거나 파란 원을 맞혀보세요</p>

    <!-- 연습 버튼 -->
    <button id="mainBtn" class="touch-btn">여기를 눌러보세요!</button>

    <!-- 연습 영역 -->
    <div id="gameArea" class="game-area">
      <div id="target" class="target-circle"></div>
    </div>

    <!-- 상태 정보 -->
    <div id="status" class="status-card">준비되시면 화면의 요소를 눌러보세요!</div>
  </div>

  <script>
    const mainBtn = document.getElementById('mainBtn');
    const target = document.getElementById('target');
    const gameArea = document.getElementById('gameArea');
    const status = document.getElementById('status');

    let pressCount = 0;

    // 통합 포인터 이벤트 (마우스, 터치, 펜 호환)
    mainBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      pressCount++;
      status.style.backgroundColor = "#E8F5E9";
      status.style.color = "#2E7D32";
      status.innerText = `녹색 버튼을 ${pressCount}번 누르셨습니다!`;
    });

    target.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();

      // 타겟 이동 로직 (영역 내부 안전 보장)
      const areaWidth = gameArea.clientWidth;
      const areaHeight = gameArea.clientHeight;
      const targetSize = 56;

      const maxLeft = areaWidth - targetSize - 16;
      const maxTop = areaHeight - targetSize - 16;

      const newLeft = Math.max(16, Math.floor(Math.random() * maxLeft));
      const newTop = Math.max(16, Math.floor(Math.random() * maxTop));

      target.style.left = `${newLeft}px`;
      target.style.top = `${newTop}px`;

      status.style.backgroundColor = "#E3F2FD";
      status.style.color = "#1565C0";
      status.innerText = "명중! 파란 원을 맞추셨습니다.";
    });
  </script>

</body>
</html>
